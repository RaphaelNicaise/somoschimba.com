<!doctype html>
<html lang="es"><head><link rel="stylesheet" href="../../tokens.css"><link rel="stylesheet" href="../bundle.css"><meta charset="utf-8">
<style>
  html, body { margin: 0; background: var(--surface); }
  .cover { position: relative; width: 960px; height: 300px; overflow: hidden; background: var(--surface); }
  .art { position: absolute; left: 480px; top: 0; }
  .green { fill: var(--chimba-green); }
  .blue { fill: var(--chimba-blue); }
  .paper { fill: var(--surface-raised); }
  .leaf { fill: none; stroke: var(--chimba-green); stroke-width: var(--stroke-hair); }
  .leaf-blue { fill: none; stroke: var(--chimba-blue); stroke-width: var(--stroke-hair); }
  .track { fill: none; stroke: var(--line); stroke-width: var(--stroke-hair); }
  .text { position: absolute; left: 48px; bottom: 48px; max-width: 440px; }
  .name { margin: 0; font: 800 120px/0.92 var(--font-sans); letter-spacing: -0.04em; color: var(--ink); }
  .tag { margin: 12px 0 0; font: 400 14px/18px var(--font-sans); letter-spacing: 0.14em; text-transform: uppercase; color: var(--ink-muted); }
</style></head>
<body>
<div class="cover">
  <svg class="art" width="480" height="300" viewBox="0 0 480 300" aria-hidden="true">
    <!--
      blocks: chimba-green slab 208×300 bleeding off top/bottom-right; chimba-blue 128×128 (space-9); surface-raised 80×48 (space-8 × space-7) like a portfolio sheet.
      arrangement: one tall slab at the right edge with two satellites stepping down-left, like the corner blocks on the láminas.
      pattern: literal motif (leaf, from radius-leaf) + one track line (radius-track): "la curva solo aparece en los gestos" — the leaf outline crosses the green slab, the track runs into the blue block.
      steps & radii: space-5 24, space-7 48, space-8 80, space-9 128; radius-none on blocks, radius-leaf 45% on two opposite corners, radius-track 160, stroke-hair 2.
    -->
    <rect class="green" x="272" y="0" width="208" height="300"/>
    <rect class="blue" x="168" y="148" width="128" height="128"/>
    <rect class="paper" x="104" y="48" width="80" height="48"/>
    <path class="track" d="M24 -2 V 112 A 160 160 0 0 0 184 272 H 168"/>
    <!-- hoja: esquinas sup-der e inf-izq redondeadas al 45% de 128 = 57.6 -->
    <g transform="rotate(1 360 104)">
      <path class="leaf-blue" d="M296 40 H 366.4 A 57.6 57.6 0 0 1 424 97.6 V 168 H 353.6 A 57.6 57.6 0 0 1 296 110.4 Z"/>
    </g>
  </svg>
  <div class="text">
    <h1 class="name">Chimba</h1>
    <p class="tag">Creative agency · somoschimba.com</p>
  </div>
</div>
</body></html>
